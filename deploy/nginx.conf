server {
    listen 80;
    listen [::]:80;
    server_name duo.varelia.fr;
    root /var/www/duo/current;
    index index.html;
    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/duo/acme;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
}
