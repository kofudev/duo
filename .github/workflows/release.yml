name: Publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        shell: pwsh
        run: |
          node -e "if(process.env.GITHUB_REF !== 'refs/tags/v'+require('./package.json').version)process.exit(1)"
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run check:public
      - run: npm run dist
      - run: python scripts/release-assets.py
      - run: npx playwright install chromium
      - run: npm run test:site
      - run: npm run test:packaged
      - name: Check packaged update dialog without network
        shell: pwsh
        run: |
          $env:DUO_PACKAGED_EXE = Join-Path $PWD 'release/win-unpacked/Duo.exe'
          node tests/updates-smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            release/Duo-*.exe
            release/Duo-*.zip
            release/release.json
            release/SHA256SUMS.txt
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - run: node scripts/publish-release.cjs
        env:
          GH_TOKEN: ${{ github.token }}
  website:
    needs: publish
    uses: ./.github/workflows/website.yml
    secrets: inherit
