name: Feature request
description: Suggest a focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user experience and an example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or tradeoffs
